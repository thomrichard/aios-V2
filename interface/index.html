<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="assets/token.js"></script><script src="assets/ambient.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: file:; connect-src 'self'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; frame-src 'self' file:; form-action 'none'; object-src 'none'"><title>RUBRIC Agentic OS</title><link rel="icon" href="assets/rubric-hex.svg"><link rel="stylesheet" href="copy.css"><link rel="stylesheet" href="assets/hex-cursor.css"></head>
<body>
<iframe id="os" src="os.html" title="Agentic OS homepage"></iframe>
<iframe id="brain" data-src="brain/index.html?portal=1" title="Second Brain" inert></iframe>
<iframe id="views" data-src="views/index.html" title="Second Brain views" inert></iframe>
<header id="controls" hidden>
 <div class="left-shell"><div id="brain-brand" aria-label="RUBRIC Second Brain"><svg viewBox="0 0 48 48" width="30" height="30" fill="none" stroke="#ff6b1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 6l18 10v16L24 42 6 32V16Z"/><path d="M24 6v16l18 10" opacity="0.5"/><path d="M24 22L6 32" opacity="0.5"/></svg><span class="b-rubric">RUBRIC</span><span class="b-product">SECOND BRAIN</span></div><div id="view-title">3D orbs</div><div class="left"><button id="back" title="Back to the OS (Escape)">← Back to the OS</button><div class="drop"><button id="menu-button" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h12M3 9h12M3 14h12"/></svg> Menu</button><div id="menu" class="dropdown" hidden>
 <div class="brain-settings"><label><input type="checkbox" data-setting="links" checked>Links</label><label><input type="checkbox" data-setting="glow" checked>Glow</label><label><input type="checkbox" data-setting="colours" checked>Colours</label><label><input type="checkbox" data-setting="labels" checked>Labels</label><hr><label><input type="checkbox" data-layer="A" checked>Applications</label><label><input type="checkbox" data-layer="R" checked>Routines</label><label><input type="checkbox" data-layer="M" checked>Memory</label><label><input type="checkbox" data-layer="S" checked>Skills</label><hr></div>
 <button id="reset-copy">Reset the layout</button></div></div></div></div>
 <div class="right"><div class="view-row"><div class="motion-wrap"><button id="motion" aria-pressed="true" title="Motion: the camera drifts and the rings turn"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor"><ellipse cx="10" cy="10" rx="8" ry="3.7" transform="rotate(-28 10 10)"/><circle cx="10" cy="10" r="3"/></svg><span>Motion</span></button><input id="motion-speed" type="range" min="0.2" max="3" step="0.05" value="1" aria-label="Motion speed" title="Motion speed"></div><nav id="view-tabs" aria-label="Second Brain views" role="tablist"><button role="tab" data-view="orbs" aria-selected="true">3D orbs</button><button role="tab" data-view="map" aria-selected="false">2D map</button><button role="tab" data-view="timeline" aria-selected="false">Timeline</button><button role="tab" data-view="calendar" aria-selected="false">Routines</button><button role="tab" data-view="skills" aria-selected="false">Skills</button><button role="tab" data-view="apps" aria-selected="false">Applications</button></nav><button id="refresh-data" title="Refresh the data: routines, skills, applications and usage (no model calls)" aria-label="Refresh data"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.5v3.2h-3.2"/></svg></button></div><div id="file-search" role="search"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg><input id="file-search-input" type="search" placeholder="Search files… ( / )" autocomplete="off" spellcheck="false" aria-label="Search files"><div id="file-search-results" role="listbox" hidden></div></div><nav id="layout-tabs" aria-label="2D map layouts" hidden><button data-layout="force" aria-pressed="false">Force</button><button data-layout="circle" aria-pressed="false">Circle</button><button data-layout="hex" aria-pressed="false">Hex</button><button data-layout="rings" aria-pressed="true">Rings</button></nav></div>
</header>
