<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><script src="../assets/token.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'"><title>SM4RT Bibliothèque</title><link rel="icon" href="../assets/sm4rt-hex.svg"><script src="../assets/apparence.js"></script><link rel="stylesheet" href="../assets/theme.css"><link rel="stylesheet" href="bibliotheque.css"></head>
<body data-page="bibliotheque">
<script src="../assets/menu.js"></script>
<header id="top"><div class="brand"><svg viewBox="0 0 48 48" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 6l18 10v16L24 42 6 32V16Z"/><path d="M24 6v16l18 10" opacity="0.5"/><path d="M24 22L6 32" opacity="0.5"/></svg><span class="b-sm4rt">SM4RT</span><span class="b-product">BIBLIOTHÈQUE</span></div><a id="home" href="/">← Retour à l’OS</a></header>
<div id="app">
 <div id="bar">
  <h1 id="bar-titre">Bibliothèque</h1>
  <div id="search"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg><input id="q" type="search" placeholder="Rechercher un asset… ( / )" autocomplete="off" spellcheck="false" aria-label="Rechercher un asset, par son nom, son dossier ou sa description"></div>
  <div id="kinds" class="seg" role="group" aria-label="Sorte de fichier"></div>
  <select id="folder" aria-label="Dossier"></select>
  <button id="undescribed" type="button" aria-pressed="false" title="Les fichiers qui n’ont pas encore leur ligne dans le _images.md de leur dossier">Sans description</button>
  <label id="size-wrap" title="Taille des vignettes"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg><input id="size" type="range" min="120" max="320" step="10" value="180" aria-label="Taille des vignettes"></label>
  <span id="count"></span>
 </div>
 <main id="grid" aria-label="Assets du workspace"></main>
</div>
<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-name" hidden>
 <div class="v-in">
  <div id="v-stage"></div>
  <aside id="v-side">
   <div class="v-head"><div><div id="v-dir"></div><h2 id="v-name"></h2></div><button id="v-close" class="icon" type="button" title="Fermer (Échap)" aria-label="Fermer"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
   <dl id="v-meta"></dl>
   <div class="v-actions">
    <button id="v-copy" type="button">Copier le chemin</button>
    <button id="v-download" type="button">Télécharger</button>
    <button id="v-open" type="button">Ouvrir sur l’ordinateur</button>
    <button id="v-index" type="button"></button>
   </div>
   <div class="v-nav"><button id="v-prev" type="button" title="Précédent (←)" aria-label="Précédent">←</button><span id="v-pos"></span><button id="v-next" type="button" title="Suivant (→)" aria-label="Suivant">→</button></div>
  </aside>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
