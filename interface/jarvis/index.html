<!doctype html>
<html lang="fr" data-mode="nuit" data-couleur="turquoise"><head><meta charset="utf-8"><script src="../assets/token.js"></script><script src="../assets/coller.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'"><title>SM4RT Jarvis</title><link rel="icon" href="../assets/sm4rt-hex.svg"><script src="../assets/apparence.js"></script><link rel="stylesheet" href="../assets/theme.css"><link rel="stylesheet" href="jarvis.css"></head>
<body data-page="jarvis">
<script src="../assets/menu.js"></script>
<main id="main">
 <div class="barre">
  <nav class="fil-ariane etiquette" aria-label="Où tu es"><span>Jarvis</span><span aria-hidden="true">/</span><span id="ici">en texte</span></nav>
  <div class="barre-d">
   <a id="retour" class="btn discret petit" href="/">← Retour à l’OS</a>
   <button type="button" class="btn discret petit" id="btn-reglages" aria-expanded="false" aria-controls="reglages" title="Apparence : nuit ou jour, et la couleur"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>Apparence</button>
  </div>
 </div>
 <header class="tete"><h1>Jarvis</h1><p>Il ouvre une application, va sur une page de l’AIOS ou cherche un fichier. La voix viendra ensuite.</p></header>
 <ol id="fil" class="fil" aria-live="polite" aria-label="La conversation"></ol>
 <form id="form" class="saisie panneau">
  <input id="texte" type="text" maxlength="500" autocomplete="off" placeholder="Ouvre Notes" aria-label="Ta demande">
  <button type="submit" class="btn primaire" id="envoyer">Envoyer</button>
 </form>
</main>
<section id="reglages" class="panneau trait" aria-label="Apparence" hidden>
 <span class="etiquette">Mode</span>
 <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="nuit" aria-pressed="false">Nuit</button><button type="button" data-mode="jour" aria-pressed="false">Jour</button><button type="button" data-mode="auto" aria-pressed="false">Auto</button></div>
 <span class="etiquette">Couleur</span>
 <div class="teintes" role="group" aria-label="Couleur"><button type="button" class="teinte" data-couleur="turquoise" style="background:#2EE6C9" aria-pressed="false" aria-label="Turquoise" title="Turquoise"></button><button type="button" class="teinte" data-couleur="braise" style="background:#FF7A45" aria-pressed="false" aria-label="Braise" title="Braise"></button><button type="button" class="teinte" data-couleur="glacier" style="background:#4DA8FF" aria-pressed="false" aria-label="Glacier" title="Glacier"></button><button type="button" class="teinte" data-couleur="violet" style="background:#A594FF" aria-pressed="false" aria-label="Violet" title="Violet"></button></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
