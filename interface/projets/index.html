<!doctype html>
<html lang="fr" data-mode="nuit" data-couleur="turquoise"><head><meta charset="utf-8"><script src="../assets/token.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'"><title>SM4RT Projets</title><link rel="icon" href="../assets/sm4rt-hex.svg"><script src="../assets/apparence.js"></script><link rel="stylesheet" href="../assets/theme.css"><link rel="stylesheet" href="projets.css"></head>
<body>
<div id="app">
 <aside id="rail" aria-label="Projets">
  <div class="marque"><span class="logo" aria-hidden="true">A</span><span class="marque-texte"><b>Projets</b><a id="retour" href="/">← Retour à l’OS</a></span></div>
  <div id="filtre" role="group" aria-label="Projets montrés"><button type="button" data-filtre="vivants" aria-pressed="true">En cours</button><button type="button" data-filtre="tous" aria-pressed="false">Tous</button></div>
  <nav id="liste" aria-label="Liste des projets"></nav>
  <div class="rail-bas">
   <button type="button" class="rail-btn" id="btn-reglages" aria-expanded="false" aria-controls="reglages" title="Apparence : nuit ou jour, et la couleur"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg><span class="rail-libelle">Apparence</span></button>
   <button type="button" class="rail-btn" id="btn-replier" aria-expanded="true" title="Replier la liste"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="ico-replier" d="M11 5 6 10l5 5M15 5l-5 5 5 5"/></svg><span class="rail-libelle">Replier</span></button>
  </div>
 </aside>
 <section id="reglages" class="panneau trait" aria-label="Apparence" hidden>
  <span class="etiquette">Mode</span>
  <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="nuit" aria-pressed="false">Nuit</button><button type="button" data-mode="jour" aria-pressed="false">Jour</button><button type="button" data-mode="auto" aria-pressed="false">Auto</button></div>
  <span class="etiquette">Couleur</span>
  <div class="teintes" role="group" aria-label="Couleur"><button type="button" class="teinte" data-couleur="turquoise" style="background:#2EE6C9" aria-pressed="false" aria-label="Turquoise" title="Turquoise"></button><button type="button" class="teinte" data-couleur="braise" style="background:#FF7A45" aria-pressed="false" aria-label="Braise" title="Braise"></button><button type="button" class="teinte" data-couleur="glacier" style="background:#4DA8FF" aria-pressed="false" aria-label="Glacier" title="Glacier"></button><button type="button" class="teinte" data-couleur="violet" style="background:#A594FF" aria-pressed="false" aria-label="Violet" title="Violet"></button></div>
 </section>

 <main id="main">
  <div id="vide"><p class="etiquette">Projets</p><h1 id="vide-titre">Chargement…</h1><p id="vide-texte"></p></div>

  <div id="projet" hidden>
   <div class="fil-ariane etiquette"><span>Projets</span><span aria-hidden="true">/</span><a id="chemin" href="#" title="Ouvrir la fiche dans Fichiers"></a><span id="enregistre"></span></div>
   <header id="tete">
    <div class="tete-g">
     <div class="puces">
      <select id="statut" class="pastille" aria-label="Statut"></select>
      <span id="domaine" class="pastille"></span>
      <label class="pastille" title="Échéance">Échéance <input id="echeance" type="date" aria-label="Échéance"></label>
     </div>
     <h1 id="titre"></h1>
     <p id="intro"></p>
    </div>
    <div class="tete-d">
     <div class="seg" id="vues" role="group" aria-label="Vue"><button type="button" data-vue="atelier" aria-pressed="true" title="Ce qui entre, ce qui se fait, ce qui sort">Atelier</button><button type="button" data-vue="fiche" aria-pressed="false" title="La fiche, et ce qui a changé">Fiche</button></div>
     <button type="button" class="btn" id="ouvrir-fiche" title="La fiche en Markdown, dans l’onglet Fichiers">Ouvrir la fiche</button>
     <button type="button" class="btn primaire" id="reprendre" title="Copie la commande à coller dans ton agent">Reprendre avec l’agent</button>
    </div>
   </header>

   <section id="atelier" aria-label="Atelier"></section>
   <section id="fiche" aria-label="Fiche" hidden></section>
  </div>
 </main>
</div>
<div id="bulle" class="panneau trait" role="dialog" aria-modal="false" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="../brain/vendor/marked.min.js"></script><script src="app.js"></script>
</body></html>
