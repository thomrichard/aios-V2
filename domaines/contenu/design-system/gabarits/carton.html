<!doctype html>
<html lang="fr" data-mode="nuit">
<head>
<meta charset="utf-8">
<title>Gabarit · carton de titre</title>
<!-- 1920 × 1080, pour ouvrir une vidéo ou un chapitre. Champs : mode, surtitre, titre. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jetons.css">
<link rel="stylesheet" href="gabarits.css">
<style>
.cadre{width:1920px;height:1080px;background:radial-gradient(42% 52% at 50% 34%,rgba(50,122,96,.55),transparent 72%),var(--fond)}
[data-mode="papier"] .cadre{background:radial-gradient(42% 52% at 50% 34%,var(--pin-100),transparent 72%),var(--fond)}
.halo{width:768px;left:576px;top:77px;--halo-flou:58px}
.vk{width:768px;left:576px;top:58px}
.bas{left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:40px;z-index:5}
.pilule{font-size:34px}
.titre{font-size:142px;font-weight:700;text-align:center;max-width:1640px}
</style>
</head>
<body>
<div class="cadre">
  <svg class="halo" viewBox="0 0 1240 1143.15"><use href="#valknut"/></svg>
  <svg class="vk" viewBox="0 0 1240 1143.15"><use href="#valknut-lumiere"/></svg>
  <div class="bas">
    <span class="pilule" data-champ="surtitre">Leçon 3 · Économiser tes tokens</span>
    <h1 class="titre" data-champ="titre">Le cache de prompt</h1>
  </div>
  <span class="grain"></span>
</div>
<script src="commun.js"></script>
</body>
</html>
